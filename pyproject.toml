[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # ruff format owns line length

[tool.ruff.format]
exclude = ["scripts/check_core.py"]  # generated byte copy of the general_ai template

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "scripts/*", ".venv/*"]
